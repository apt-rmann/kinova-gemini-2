<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinova Gemini</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e2e5ea;
    --text: #1b1d21;
    --dim: #6b7280;
    --ok: #157f3d;
    --fail: #b3261e;
    --warn: #9a6700;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; gap: 12px; padding: 12px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .col-left { width: 35%; min-width: 300px; display: flex; flex-direction: column; gap: 12px; }
  .col-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  #cam { width: 100%; border-radius: 6px; display: block; background: #000; min-height: 120px; }
  .state { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .state span:nth-child(odd) { color: var(--dim); }
  #stop {
    width: 100%; padding: 18px; font-size: 20px; font-weight: 700; letter-spacing: .08em;
    color: #fff; background: #c8322a; border: none; border-radius: 10px; cursor: pointer;
  }
  #stop:hover { background: #a82820; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fail); flex: none; }
  .dot.on { background: var(--ok); }

  #timeline { flex: 1; overflow-y: auto; padding: 4px 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.right { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; }
  .bubble.user { background: var(--accent); color: #fff; border-color: transparent; }
  .sys { color: var(--dim); font-size: 12px; text-align: center; }
  .divider { border-top: 1px solid var(--line); margin: 2px 20%; }
  .err { color: var(--fail); font-size: 13px; }
  details.thought { color: var(--dim); font-style: italic; font-size: 13px; }
  details.thought summary { cursor: pointer; font-style: normal; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .tool { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 8px 10px; }
  .tool .name { font-weight: 600; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; color: #fff; margin-left: 6px; }
  .badge.ok { background: var(--ok); } .badge.fail { background: var(--fail); } .badge.warn { background: var(--warn); }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
  .imgcard { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 8px; }
  .imgcard .cap { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .imgcard img { max-width: 100%; border-radius: 6px; display: block; }
  form { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  #msg { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--card); color: var(--text); }
  button.send { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="col-left">
  <div class="card">
    <h2>Camera</h2>
    <img id="cam" alt="camera stream"
         src="http://localhost:8080/stream?topic=/camera/realsense/color/image_raw&width=480">
  </div>
  <div class="card">
    <h2>Robot</h2>
    <div class="state">
      <span>x</span><span id="rx">-</span>
      <span>y</span><span id="ry">-</span>
      <span>z</span><span id="rz">-</span>
      <span>gripper</span><span id="rg">-</span>
    </div>
  </div>
  <button id="stop">STOP</button>
  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting to rosbridge…</span></div>
    <div class="status" style="margin-top:6px"><span id="sess">session: —</span></div>
  </div>
</div>

<div class="col-right card" style="display:flex">
  <div id="timeline"></div>
  <form id="form">
    <input id="msg" autocomplete="off" placeholder="Tell the robot what to do…">
    <button class="send" type="submit">Send</button>
  </form>
</div>

<script>
const TL = document.getElementById('timeline');
const pendingImages = {};   // image_id -> card element waiting for the JPEG
const orphanImages = {};    // image_id -> data URI that arrived before its event
let modelBubble = null;     // consecutive model_text chunks append here
let thoughtBox = null;

function atBottom() { return TL.scrollHeight - TL.scrollTop - TL.clientHeight < 80; }
function add(el) {
  const stick = atBottom();
  TL.appendChild(el);
  if (stick) TL.scrollTop = TL.scrollHeight;
  return el;
}
function make(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });
ros.on('connection', () => {
  document.getElementById('dot').classList.add('on');
  document.getElementById('conn').textContent = 'rosbridge connected';
});
ros.on('close', () => {
  document.getElementById('dot').classList.remove('on');
  document.getElementById('conn').textContent = 'rosbridge disconnected';
});
ros.on('error', () => {
  document.getElementById('conn').textContent = 'rosbridge error - is it running?';
});

// --- robot state (throttled to ~5 Hz) ---
new ROSLIB.Topic({
  ros, name: '/robot_state', messageType: 'ros2_interfaces/msg/RobotState', throttle_rate: 200
}).subscribe(m => {
  document.getElementById('rx').textContent = m.x.toFixed(3);
  document.getElementById('ry').textContent = m.y.toFixed(3);
  document.getElementById('rz').textContent = m.z.toFixed(3);
  document.getElementById('rg').textContent = m.gripper_position.toFixed(2);
});

// --- stop ---
const stopTopic = new ROSLIB.Topic({ ros, name: '/stop', messageType: 'std_msgs/msg/Empty' });
document.getElementById('stop').onclick = () => stopTopic.publish(new ROSLIB.Message({}));

// --- user instructions ---
const instrTopic = new ROSLIB.Topic({ ros, name: '/user_instructions', messageType: 'std_msgs/msg/String' });
document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  instrTopic.publish(new ROSLIB.Message({ data: text }));
  input.value = '';
};

// --- images the model saw ---
new ROSLIB.Topic({
  ros, name: '/agent/model_image', messageType: 'sensor_msgs/msg/CompressedImage'
}).subscribe(m => {
  const uri = 'data:image/jpeg;base64,' + m.data;
  const id = m.header.frame_id;
  const card = pendingImages[id];
  if (card) {
    const img = make('img');
    img.src = uri;
    card.appendChild(img);
    delete pendingImages[id];
    if (atBottom()) TL.scrollTop = TL.scrollHeight;
  } else {
    orphanImages[id] = uri;   // event has not arrived yet
  }
});

// --- event timeline ---
new ROSLIB.Topic({
  ros, name: '/agent/events', messageType: 'std_msgs/msg/String'
}).subscribe(m => {
  let ev;
  try { ev = JSON.parse(m.data); } catch (_) { return; }
  render(ev.type, ev.data || {});
});

function render(type, d) {
  if (type !== 'model_text') modelBubble = null;
  if (type !== 'model_thought') thoughtBox = null;

  switch (type) {
    case 'session':
      document.getElementById('sess').textContent = 'session: ' + (d.status || '');
      add(make('div', 'sys', 'session ' + (d.status || '')));
      break;

    case 'user_text': {
      const row = add(make('div', 'row right'));
      row.appendChild(make('div', 'bubble user', d.text || ''));
      break;
    }

    case 'model_text':
      if (!modelBubble) {
        const row = add(make('div', 'row'));
        modelBubble = row.appendChild(make('div', 'bubble', ''));
      }
      modelBubble.textContent += (d.text || '');
      if (atBottom()) TL.scrollTop = TL.scrollHeight;
      break;

    case 'model_thought':
      if (!thoughtBox) {
        thoughtBox = add(make('details', 'thought'));
        thoughtBox.appendChild(make('summary', null, 'thinking'));
        thoughtBox.appendChild(make('div', null, ''));
      }
      thoughtBox.lastChild.textContent += (d.text || '');
      break;

    case 'image': {
      const card = add(make('div', 'imgcard'));
      card.appendChild(make('div', 'cap', d.reason || 'image'));
      if (orphanImages[d.id]) {
        const img = make('img');
        img.src = orphanImages[d.id];
        card.appendChild(img);
        delete orphanImages[d.id];
      } else {
        pendingImages[d.id] = card;
      }
      break;
    }

    case 'tool_call': {
      const card = add(make('div', 'tool mono'));
      card.id = 'call-' + d.id;
      const args = JSON.stringify(d.args || {});
      card.appendChild(make('div', 'name', `${d.name}(${args === '{}' ? '' : args})`));
      break;
    }

    case 'tool_result': {
      const r = d.result || {};
      const card = document.getElementById('call-' + d.id) || add(make('div', 'tool mono'));
      const status = r.status || (r.ok ? 'ok' : 'failed');
      const kind = r.ok ? 'ok' : (status === 'interrupted' ? 'warn' : 'fail');
      const head = card.querySelector('.name') || card.appendChild(make('div', 'name', d.name));
      if (!head.querySelector('.badge')) head.appendChild(make('span', 'badge ' + kind, status));
      const details = card.appendChild(make('details'));
      details.appendChild(make('summary', null, 'result'));
      details.appendChild(make('pre', null, JSON.stringify(r, null, 2)));
      if (atBottom()) TL.scrollTop = TL.scrollHeight;
      break;
    }

    case 'look': {
      const lines = (d.objects || []).map(o =>
        o.measurable ? `${o.id}  [${o.centroid_xyz.join(', ')}]` : `${o.id}  (not measurable)`);
      if (d.not_found && d.not_found.length) lines.push('not found: ' + d.not_found.join(', '));
      add(make('div', 'tool mono', lines.join('\n') || 'nothing found'));
      break;
    }

    case 'interrupted':
    case 'turn_complete':
      add(make('div', 'divider'));
      break;

    case 'error':
      add(make('div', 'err', `${d.where || 'error'}: ${d.message || ''}`));
      break;
  }
}
</script>
</body>
</html>
