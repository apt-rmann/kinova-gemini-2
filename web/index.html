<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinova Gemini UI</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>

<style>
  #timeline {
    scrollbar-width: thin;
    scrollbar-color: #e5e7eb #f9fafb;
  }
  #timeline::-webkit-scrollbar { width: 6px; }
  #timeline::-webkit-scrollbar-track { background: #f9fafb; }
  #timeline::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 3px; }

  /* Every timeline entry fades in as it streams from /agent/events. */
  .entry { animation: fadeIn .2s ease-out forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Chat bubbles: user on the right in blue, model on the left in purple. */
  .bubble {
    max-width: 90%;
    padding: .75rem;
    border-radius: 1rem;
    font-size: .85rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bubble-user  { align-self: flex-end;   background: #3b82f6; color: #fff; border-bottom-right-radius: .25rem; }
  .bubble-model { align-self: flex-start; background: #7c3aed; color: #fff; border-bottom-left-radius: .25rem; }

  button { transition: all .1s ease-in-out; }
  button:active { transform: translateY(1px); }

  .skill pre { max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
</style>
</head>

<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col overflow-hidden p-4 gap-4">

<!-- Header -->
<header class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border-b-2 border-gray-200 shrink-0">
  <div class="flex items-center gap-4">
    <div class="bg-gray-900 text-white p-2 rounded-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-black text-gray-900 uppercase tracking-tighter">Kinova-Gemini <span class="text-blue-600">Command Center</span></h1>
      <div class="flex items-center gap-2 mt-0.5">
        <div id="connection-status" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-600 uppercase tracking-widest animate-pulse">Disconnected</div>
        <div id="session-status" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-gray-100 text-gray-500 uppercase tracking-widest">session —</div>
      </div>
    </div>
  </div>

  <button id="estop-btn" class="bg-red-600 hover:bg-red-700 text-white font-black py-3 px-8 rounded-md text-sm uppercase tracking-widest shadow-lg border-b-4 border-red-900 active:border-b-0 active:translate-y-1">
    Emergency stop
  </button>
</header>

<!-- Main workspace: event timeline (2/3) + camera (1/3) -->
<main class="flex-grow grid grid-cols-2 gap-4 min-h-0 overflow-hidden">

  <!-- LEFT: Gemini chat / event timeline -->
  <div class="bg-white rounded-lg shadow-md flex flex-col h-full border-t-4 border-purple-500 overflow-hidden">
    <div class="p-3 border-b border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-2">
        <i class="fas fa-brain text-purple-500 text-xs"></i>
        <h2 class="text-xs font-black uppercase tracking-[0.2em] text-gray-500">Gemini Chat</h2>
      </div>
      <span class="flex h-2 w-2 rounded-full bg-purple-400 animate-pulse"></span>
    </div>

    <div id="timeline" class="flex-grow bg-gray-50 p-4 overflow-y-auto flex flex-col gap-2 leading-relaxed">
      <div class="text-gray-400 italic text-[10px] text-center uppercase tracking-widest py-2 border-b border-gray-100 mb-2 shrink-0">Neural bridge active</div>
    </div>

    <div class="p-3 border-t border-gray-100 bg-white shrink-0">
      <form id="command-form" class="flex gap-2">
        <input type="text" id="command-input" autocomplete="off" placeholder="Tell the robot what to do…"
               class="flex-grow p-3 border-2 border-gray-100 rounded-lg focus:outline-none focus:border-blue-500 bg-gray-50 text-sm font-medium transition-all duration-200 placeholder:text-gray-400">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-6 rounded-lg shadow-md uppercase text-xs tracking-widest shrink-0">
          Send
        </button>
      </form>
    </div>
  </div>

  <!-- RIGHT: camera feed -->
  <div class="bg-white p-2 rounded-lg shadow-md border-t-4 border-gray-900 flex flex-col h-full overflow-hidden">
    <div class="px-3 py-1 flex justify-between items-center mb-1 shrink-0">
      <h2 class="text-xs font-black uppercase tracking-[0.2em] text-gray-500">Camera Stream</h2>
      <div class="flex items-center gap-2">
        <span class="text-[10px] font-bold text-green-600 uppercase">Live</span>
        <span class="h-2 w-2 rounded-full bg-green-500"></span>
      </div>
    </div>
    <!-- No width= on the stream URL: web_video_server serves the camera's native
         resolution, and the image is only ever letterboxed, never scaled per-axis. -->
    <div class="flex-grow min-h-0 bg-black rounded-md overflow-hidden flex items-center justify-center border border-gray-200">
      <img id="video-stream" alt="camera stream" class="max-w-full max-h-full w-auto h-auto object-contain"
           src="http://localhost:8080/stream?topic=/camera/realsense/color/image_raw&type=mjpeg">
    </div>
  </div>

</main>

<!-- Robot state strip -->
<footer class="bg-white p-3 rounded-lg shadow-md border-t-4 border-blue-500 flex justify-between items-center gap-4 shrink-0">
  <div class="flex items-center gap-2 shrink-0 border-r border-gray-200 pr-4">
    <div class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-black uppercase tracking-wider">Robot State</div>
  </div>

  <div class="flex flex-grow justify-around items-center gap-6">
    <div class="flex flex-col">
      <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">End Effector Pose (XYZ)</span>
      <span id="state-position" class="font-mono text-sm font-bold text-gray-900">—, —, —</span>
    </div>

    <div class="flex flex-col">
      <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">Orientation (RPY)</span>
      <span id="state-orientation" class="font-mono text-sm font-bold text-gray-900">—, —, —</span>
    </div>

    <div class="flex flex-col flex-grow max-w-[300px]">
      <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">Gripper State</span>
      <div class="relative w-full bg-blue-100 h-5 rounded-md overflow-hidden flex items-center border border-blue-200">
        <div id="gripper-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
        <span id="state-gripper" class="absolute inset-0 flex items-center justify-center font-mono font-black text-[10px] text-blue-900">0.0%</span>
      </div>
    </div>

    <div class="flex flex-col items-center">
      <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">Status</span>
      <span id="state-moving" class="px-3 py-1 rounded font-black uppercase text-[10px] tracking-wider bg-green-100 text-green-800 border border-green-200">Stationary</span>
    </div>
  </div>
</footer>

<script>
const TL = document.getElementById('timeline');
const pendingImages = {};   // image_id -> card element waiting for the JPEG
const orphanImages = {};    // image_id -> data URI that arrived before its event
let modelBubble = null;     // consecutive model_text chunks append here
let thoughtBox = null;

function atBottom() { return TL.scrollHeight - TL.scrollTop - TL.clientHeight < 80; }
function add(el) {
  const stick = atBottom();
  el.classList.add('entry');
  TL.appendChild(el);
  if (stick) TL.scrollTop = TL.scrollHeight;
  return el;
}
function make(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

// Shared class strings for the card-style timeline entries.
const CLS = {
  sys:     'self-center text-gray-500 italic text-[11px] uppercase tracking-widest',
  divider: 'self-center w-1/2 border-t border-gray-200 my-1',
  err:     'self-stretch bg-red-50 border border-red-200 text-red-700 rounded-lg px-3 py-2 text-xs font-bold',
  thought: 'self-stretch bg-white border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-500 italic',
  skill:   'self-stretch bg-white border border-gray-200 rounded-lg px-3 py-2 font-mono text-[12px]',
  img:     'self-stretch bg-white border border-gray-200 rounded-lg p-2',
};

const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });
const statusEl = document.getElementById('connection-status');

function setConn(text, ok) {
  statusEl.textContent = text;
  statusEl.className = 'inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-widest '
    + (ok ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600 animate-pulse');
}

ros.on('connection', () => setConn('Connected', true));
ros.on('close', () => setConn('Disconnected', false));
ros.on('error', () => setConn('Error', false));

// --- robot state (throttled to ~5 Hz) ---
const statePosition = document.getElementById('state-position');
const stateOrientation = document.getElementById('state-orientation');
const stateGripper = document.getElementById('state-gripper');
const gripperBar = document.getElementById('gripper-bar');
const movingEl = document.getElementById('state-moving');
let lastJointAngles = null;

new ROSLIB.Topic({
  ros, name: '/robot_state', messageType: 'ros2_interfaces/msg/RobotState', throttle_rate: 200
}).subscribe(m => {
  statePosition.textContent = `${m.x.toFixed(3)}, ${m.y.toFixed(3)}, ${m.z.toFixed(3)}`;
  stateOrientation.textContent = `${m.theta_x.toFixed(1)}, ${m.theta_y.toFixed(1)}, ${m.theta_z.toFixed(1)}`;

  // The controller reports the gripper as 0 (open) to 1 (closed).
  const pct = m.gripper_position * 100;
  stateGripper.textContent = pct.toFixed(1) + '%';
  gripperBar.style.width = pct.toFixed(1) + '%';

  // Movement is estimated client-side from joint-angle deltas; nothing publishes it.
  let isMoving = false;
  if (lastJointAngles && m.joint_angles) {
    isMoving = m.joint_angles.some((a, i) => Math.abs(a - lastJointAngles[i]) > 0.05);
  }
  lastJointAngles = m.joint_angles;

  movingEl.textContent = isMoving ? 'Moving' : 'Stationary';
  movingEl.className = 'px-3 py-1 rounded font-black uppercase text-[10px] tracking-wider border '
    + (isMoving ? 'bg-yellow-100 text-yellow-800 border-yellow-200 animate-pulse'
                : 'bg-green-100 text-green-800 border-green-200');
});

// --- stop ---
const stopTopic = new ROSLIB.Topic({ ros, name: '/stop', messageType: 'std_msgs/msg/Empty' });
const estopBtn = document.getElementById('estop-btn');
estopBtn.onclick = () => {
  stopTopic.publish(new ROSLIB.Message({}));
  add(make('div', CLS.sys, 'emergency stop issued'));
  estopBtn.classList.add('bg-red-800');
  setTimeout(() => estopBtn.classList.remove('bg-red-800'), 500);
};

// --- user instructions ---
const instrTopic = new ROSLIB.Topic({ ros, name: '/user_instructions', messageType: 'std_msgs/msg/String' });
const commandInput = document.getElementById('command-input');
document.getElementById('command-form').onsubmit = e => {
  e.preventDefault();
  const text = commandInput.value.trim();
  if (!text) return;
  instrTopic.publish(new ROSLIB.Message({ data: text }));
  commandInput.value = '';
};

// --- images the model saw ---
new ROSLIB.Topic({
  ros, name: '/agent/model_image', messageType: 'sensor_msgs/msg/CompressedImage'
}).subscribe(m => {
  const uri = 'data:image/jpeg;base64,' + m.data;
  const id = m.header.frame_id;
  const card = pendingImages[id];
  if (card) {
    const img = make('img', 'w-full rounded-md border border-black/10');
    img.src = uri;
    card.appendChild(img);
    delete pendingImages[id];
    if (atBottom()) TL.scrollTop = TL.scrollHeight;
  } else {
    orphanImages[id] = uri;   // event has not arrived yet
  }
});

// --- event timeline ---
new ROSLIB.Topic({
  ros, name: '/agent/events', messageType: 'std_msgs/msg/String'
}).subscribe(m => {
  let ev;
  try { ev = JSON.parse(m.data); } catch (_) { return; }
  render(ev.type, ev.data || {});
});

function render(type, d) {
  if (type !== 'model_text') modelBubble = null;
  if (type !== 'model_thought') thoughtBox = null;

  switch (type) {
    case 'session': {
      const status = d.status || '';
      const el = document.getElementById('session-status');
      el.textContent = 'session ' + status;
      el.className = 'inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-widest '
        + (status === 'connected' || status === 'ready' || status === 'started'
            ? 'bg-purple-100 text-purple-600' : 'bg-gray-100 text-gray-500');
      add(make('div', CLS.sys, 'session ' + status));
      break;
    }

    case 'user_text':
      add(make('div', 'bubble bubble-user', d.text || ''));
      break;

    case 'model_text':
      if (!modelBubble) modelBubble = add(make('div', 'bubble bubble-model', ''));
      modelBubble.textContent += (d.text || '');
      if (atBottom()) TL.scrollTop = TL.scrollHeight;
      break;

    case 'model_thought':
      if (!thoughtBox) {
        thoughtBox = add(make('details', CLS.thought));
        const summary = thoughtBox.appendChild(make('summary', 'cursor-pointer not-italic font-bold uppercase tracking-widest text-[10px] text-gray-400'));
        summary.innerHTML = '<i class="fas fa-lightbulb mr-1"></i>thinking';
        thoughtBox.appendChild(make('div', 'mt-1 whitespace-pre-wrap', ''));
      }
      thoughtBox.lastChild.textContent += (d.text || '');
      break;

    case 'image': {
      const card = add(make('div', CLS.img));
      card.appendChild(make('div', 'text-gray-400 font-bold uppercase text-[9px] tracking-widest mb-1', d.reason || 'image'));
      if (orphanImages[d.id]) {
        const img = make('img', 'w-full rounded-md border border-black/10');
        img.src = orphanImages[d.id];
        card.appendChild(img);
        delete orphanImages[d.id];
      } else {
        pendingImages[d.id] = card;
      }
      break;
    }

    case 'skill_call': {
      const card = add(make('div', CLS.skill));
      card.id = 'call-' + d.id;
      const args = JSON.stringify(d.args || {});
      const head = card.appendChild(make('div', 'name font-bold text-gray-900 break-words'));
      head.innerHTML = '<i class="fas fa-wrench text-gray-400 mr-1"></i>';
      head.appendChild(make('span', null, `${d.name}(${args === '{}' ? '' : args})`));
      break;
    }

    case 'skill_result': {
      const r = d.result || {};
      const card = document.getElementById('call-' + d.id) || add(make('div', CLS.skill));
      const status = r.status || (r.ok ? 'ok' : 'failed');
      const tone = r.ok ? 'bg-green-100 text-green-800'
                 : (status === 'interrupted' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-700');
      const head = card.querySelector('.name') || card.appendChild(make('div', 'name font-bold text-gray-900', d.name));
      if (!head.querySelector('.badge')) {
        head.appendChild(make('span',
          'badge ml-2 px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ' + tone, status));
      }
      const details = card.appendChild(make('details', 'mt-1'));
      details.appendChild(make('summary', 'cursor-pointer text-gray-400 font-bold uppercase tracking-widest text-[10px]', 'result'));
      details.appendChild(make('pre', 'mt-1 text-gray-700', JSON.stringify(r, null, 2)));
      if (atBottom()) TL.scrollTop = TL.scrollHeight;
      break;
    }

    case 'look': {
      const lines = (d.objects || []).map(o => {
        if (!o.measurable) return `${o.id}  (not measurable)`;
        const size = [o.width_mm != null ? `w ${o.width_mm}mm` : null,
                      o.depth_mm != null ? `d ${o.depth_mm}mm` : null].filter(Boolean).join('  ');
        return `${o.id}  [${o.centroid_xyz.join(', ')}]${size ? '  ' + size : ''}`;
      });
      if (d.not_found && d.not_found.length) lines.push('not found: ' + d.not_found.join(', '));
      const card = add(make('div', CLS.skill));
      card.appendChild(make('div', 'text-gray-400 font-bold uppercase text-[9px] tracking-widest mb-1', 'look'));
      card.appendChild(make('div', 'whitespace-pre-wrap text-gray-700', lines.join('\n') || 'nothing found'));
      break;
    }

    case 'pick': {
      const card = add(make('div', CLS.skill));
      card.appendChild(make('div', 'text-gray-400 font-bold uppercase text-[9px] tracking-widest mb-1', 'pick'));
      card.appendChild(make('div', 'text-gray-700',
        `[${(d.target || []).map(v => Number(v).toFixed(3)).join(', ')}]  ` +
        `w ${d.width_mm}mm d ${d.depth_mm}mm  gripper ${d.preshape} -> ${d.final}`));
      break;
    }

    case 'holster': {
      const where = d.found ? `marker ${d.marker_id} found` : `marker ${d.marker_id} NOT found`;
      const card = add(make('div', CLS.skill));
      card.appendChild(make('div', 'text-gray-400 font-bold uppercase text-[9px] tracking-widest mb-1', 'holster'));
      card.appendChild(make('div', 'text-gray-700', `${d.action} ${d.tool}: ${where}`));
      break;
    }

    case 'interrupted':
    case 'turn_complete':
      add(make('div', CLS.divider));
      break;

    case 'error': {
      const el = add(make('div', CLS.err));
      el.innerHTML = '<i class="fas fa-triangle-exclamation mr-1"></i>';
      el.appendChild(make('span', null, `${d.where || 'error'}: ${d.message || ''}`));
      break;
    }
  }
}
</script>
</body>
</html>
